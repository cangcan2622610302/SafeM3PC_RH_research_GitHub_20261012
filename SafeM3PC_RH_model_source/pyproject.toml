[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hsr-ttr-safe-m3pc"
version = "0.1.0"
description = "Research prototype for uncertainty-aware high-speed railway rolling rescheduling"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.23,<2.0",
  "scipy>=1.10,<2.0",
]

[project.optional-dependencies]
learning = ["torch>=1.13"]
dev = ["torch>=1.13", "pytest>=7.0,<9.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
